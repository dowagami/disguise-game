function dealHand(existing=[]){const hand=[...existing];SLOT_KEYS.forEach(slot=>{const pool=ITEMS[slot].filter(i=>!hand.find(h=>h.id===i.id));hand.push(...pick(pool,2));});return hand;}

let state={round:0,day:1,loc:generateLocation(0),visited:[],equipped:{head:null,face:null,top:null,bottom:null,bag:null,shoes:null},hand:dealHand(),prevEquipped:{head:null,face:null,top:null,bottom:null,bag:null,shoes:null},itemAge:{},suspicion:20,activeSlot:null,stealCount:0,message:"",gameOver:false,won:false,crime:CRIMES[Math.floor(Math.random()*CRIMES.length)]};

function getComboBonus(){let bonus=0,comboName="";const ids=new Set(SLOT_KEYS.map(s=>state.equipped[s]?.id).filter(Boolean));COMBOS.forEach(([a,b,b2,name])=>{if(ids.has(a)&&ids.has(b)){bonus+=b2;comboName=name;}});return{bonus,comboName};}
function calcDisguiseRaw(){let total=0;SLOT_KEYS.forEach(slot=>{const item=state.equipped[slot];if(item){const age=state.itemAge[item.id]||0;const decay=Math.max(0,1-age*.20);const prev=state.prevEquipped[slot];const isNew=!prev||prev.id!==item.id;const base=item.power*decay;total+=isNew?base:base*.35;}});const{bonus}=getComboBonus();return total+bonus;}
function rawToDisplay(raw){const MAX_RAW=420;const ratio=Math.min(1,raw/MAX_RAW);return Math.round(Math.pow(ratio,0.65)*100);}
function calcDisguise(){return rawToDisplay(calcDisguiseRaw());}
function getRisk(susOverride){const d=calcDisguise();const diff=state.loc.diff;const sus=susOverride!==undefined?susOverride:state.suspicion;return Math.max(0,Math.min(100,Math.round(sus*diff-d*.65)));}
function getRiskInfo(r){if(r<20)return{text:"ほぼ安全",sub:"誰も気にしていません",color:"#2A6B12",bg:"#EAF3DE",border:"#C0DD97",bar:"#639922",eyes:1};if(r<38)return{text:"やや注意",sub:"ちらちら見られています",color:"#633806",bg:"#FAEEDA",border:"#FAC775",bar:"#EF9F27",eyes:2};if(r<56)return{text:"危険！",sub:"怪しまれています",color:"#8B3010",bg:"#FAEDE7",border:"#F5C4B3",bar:"#D85A30",eyes:4};if(r<75)return{text:"高危険！！",sub:"職務質問されそう",color:"#7A1F1F",bg:"#FAE0E0",border:"#F5A5A5",bar:"#E24B4A",eyes:6};return{text:"即逮捕レベル！！！",sub:"完全にマークされています",color:"#5A0A0A",bg:"#F5C8C8",border:"#E24B4A",bar:"#A32D2D",eyes:8};}
function eyeRowHTML(eyes,risk){let h="";for(let i=0;i<eyes;i++)h+='<span style="font-size:26px;line-height:1;">👁️</span>';if(risk>=75)h+='<span style="font-size:24px;margin-left:4px;">🚔</span>';return h;}
function getDisguiseLabelIdx(d){if(d<15)return 0;if(d<35)return 1;if(d<60)return 2;if(d<82)return 3;return 4;}
function getFlavorComment(){const equipped=SLOT_KEYS.map(s=>state.equipped[s]).filter(Boolean);if(equipped.length===0)return"まだ何も装備していません。さあ変装しましょう！";const{comboName}=getComboBonus();if(comboName==="ゴリラ完全体")return"ゴリラの着ぐるみを上下コンプリート。もはや逃亡者ではなくゴリラだ。";if(comboName==="老人の二重装備")return"ハゲヅラに老人メイク。鏡を見てちょっと怖くなった。";if(comboName==="お祭り芸人")return"ピエロ＋サンタ。もはやお祭りの呼び込みだ。";if(state.equipped.shoes?.id==="s7")return"フリッパーをはいて逃げるのは無理がある。ペタペタと足音が響いている。";if(state.equipped.bag?.id==="g8")return"現金の袋をぶら下げて歩いている。これは誰がどう見ても怪しい。";if(state.equipped.bottom?.id==="b6")return"ふんどし一丁で街に出た。もはや変装ではなく主張だ。";if(state.equipped.face?.id==="f7")return"ピエロメイクで移動中。子供が泣き止まない。大人は目を逸らしている。";return equipped[equipped.length-1].flavor;}
function calcDiscardCount(){const d=state.day;if(d<=10)return 1+Math.floor(Math.random()*2);if(d<=30)return 2+Math.floor(Math.random()*2);if(d<=60)return 3+Math.floor(Math.random()*2);if(d<=80)return 4+Math.floor(Math.random()*2);return 5+Math.floor(Math.random()*2);}
function chooseDiscards(count){const equipped=SLOT_KEYS.map(s=>state.equipped[s]).filter(Boolean);return pick(equipped,Math.min(count,equipped.length));}
function getStealRisk(){const baseSus=state.suspicion+12*(state.stealCount+1);const d=calcDisguise();const diff=state.loc.diff;return Math.max(5,Math.min(90,Math.round(baseSus*diff*0.42-d*.28)));}
function getEscapeScenario(risk,caught){const loc=state.loc;if(caught)return{scenes:[`${loc.flag}${loc.shortName}の路地を急ぎ足で歩いていると`,`「ちょっとそこの方」`,`振り向くと制服の警官が二人`,`…`,`終わった`],result:"御用です！！",success:false};if(risk<25)return{scenes:[`${loc.flag}${loc.shortName}の駅前を堂々と通り抜けた`,`誰も振り返らない`,`完璧だ`],result:`→ 次の町へ出発！（${state.day+1}日目へ）`,success:true};if(risk<55)return{scenes:[`${loc.flag}${loc.shortName}の検問に差しかかった`,`警官と目が合った`,`…じっと見られている`,`…`,`通過した！`],result:`→ 次の町へ！（ヒヤヒヤ／${state.day+1}日目へ）`,success:true};return{scenes:[`前から警官が歩いてきた`,`目を逸らす`,`足音が近づく`,`…`,`…`,`すれ違った！！`],result:`→ 次の町へ！（間一髪／${state.day+1}日目へ）`,success:true};}
const STEAL_SUCCESS=[["おじゃましま～す。ドロボーですよー","…物色中…","…ありましたよー","いただいていきますね。えへへ","空き巣成功！"],["ガラスを割って侵入","…家の中はがらんとしてる","タンスの中に何かある…","ズボッ。あった！","空き巣成功！"],["裏口から忍び込む","…しーん…","クローゼットを漁る","お！これは使えそう","空き巣成功！"]];
const STEAL_FAIL=[["窓から忍び込もうとすると","隣人に目撃された","「ドロボー！」","…","近所中に響き渡った"],["玄関を開けた瞬間","中に人がいた","「だれ！？」","…","逃げ場がない"]];

let escapeCallback=null;
function runAnimation(titleTxt,scenes,resultTxt,resultColor,discardHTML,cb){escapeCallback=cb;document.getElementById("esc-title").textContent=titleTxt;document.getElementById("esc-scene").textContent="";document.getElementById("esc-result").textContent="";document.getElementById("esc-discard").innerHTML="";document.getElementById("esc-ok").style.display="none";document.getElementById("escape-overlay").classList.add("show");let i=0;function next(){if(i<scenes.length){const line=scenes[i++];if(line==="…"){let dots="",d=0;const iv=setInterval(()=>{dots+="・";const el=document.getElementById("esc-scene");el.textContent=el.textContent.replace(/・+$/,"")+dots;if(++d>=3){clearInterval(iv);setTimeout(next,350);}},280);}else{const el=document.getElementById("esc-scene");el.textContent=(el.textContent?el.textContent+"\n":"")+line;setTimeout(next,680);}}else{const re=document.getElementById("esc-result");re.textContent=resultTxt;re.style.color=resultColor;if(discardHTML){setTimeout(()=>{document.getElementById("esc-discard").innerHTML=discardHTML;document.getElementById("esc-ok").style.display="inline-flex";},700);}else{document.getElementById("esc-ok").style.display="inline-flex";}}}setTimeout(next,350);}
function afterEscape(){document.getElementById("escape-overlay").classList.remove("show");if(escapeCallback)escapeCallback();}

function proceed(){const risk=getRisk();const caught=Math.random()*100<risk;const discards=caught?[]:chooseDiscards(calcDiscardCount());const scenario=getEscapeScenario(risk,caught);const discardHTML=(!caught&&discards.length>0)?"<strong>— 移動中に目撃された変装 —</strong><br>"+discards.map(d=>`「${d.name}」${DISCARD_MSGS[Math.floor(Math.random()*DISCARD_MSGS.length)]}`).join("<br>"):null;runAnimation(`${state.loc.flag}${state.loc.name} 脱出`,scenario.scenes,scenario.result,scenario.success?"#185FA5":"#A32D2D",discardHTML,()=>{if(caught){state.gameOver=true;state.won=false;render();return;}const discardIds=new Set(discards.map(d=>d.id));state.hand=state.hand.filter(i=>!discardIds.has(i.id));SLOT_KEYS.forEach(s=>{if(state.equipped[s]&&discardIds.has(state.equipped[s].id))state.equipped[s]=null;});SLOT_KEYS.forEach(s=>{const it=state.equipped[s];if(it)state.itemAge[it.id]=(state.itemAge[it.id]||0)+1;});state.prevEquipped={...state.equipped};state.visited.push(state.loc);if(state.day>=TOTAL_DAYS){state.gameOver=true;state.won=true;render();return;}state.day++;state.loc=generateLocation(state.day-1);state.round++;state.stealCount=0;state.suspicion=Math.max(10,state.suspicion-5);state.message=`${state.loc.flag}${state.loc.name}に到着！変装を見直しましょう。`;if(state.loc.diff>=2.5){const bonus=[];SLOT_KEYS.forEach(s=>{const av=ITEMS[s].filter(i=>!state.hand.find(h=>h.id===i.id));if(av.length>0)bonus.push(pick(av,1)[0]);});state.hand=[...state.hand,...bonus];}render();});}
function steal(){const stealRisk=getStealRisk();const caught=Math.random()*100<stealRisk;if(caught){const sc=STEAL_FAIL[Math.floor(Math.random()*STEAL_FAIL.length)];runAnimation("空き巣 失敗！",sc,"御用です！！","#A32D2D",null,()=>{state.gameOver=true;state.won=false;render();});return;}const sc=STEAL_SUCCESS[Math.floor(Math.random()*STEAL_SUCCESS.length)];state.suspicion=Math.min(100,state.suspicion+10);state.stealCount++;const getCount=2+Math.floor(Math.random()*2);const availableSlots=pick(SLOT_KEYS,Math.min(getCount,SLOT_KEYS.length));const newItems=[];availableSlots.forEach(s=>{const pool=ITEMS[s].filter(i=>!state.hand.find(h=>h.id===i.id));if(pool.length>0)newItems.push(pick(pool,1)[0]);});state.hand=[...state.hand,...newItems];const acquired=newItems.map(i=>i.emoji+i.name).join("、");runAnimation("空き巣",sc,`入手：${acquired||"なし"}`,"#185FA5",null,()=>{state.message=`空き巣成功（${state.stealCount}回目）！疑惑度が少し上昇。`;render();});}
function activateSlot(slot){state.activeSlot=state.activeSlot===slot?null:slot;render();}
function unequipItem(slot,ev){ev.stopPropagation();state.equipped[slot]=null;render();}
function equipItem(id){const item=state.hand.find(i=>i.id===id);if(!item)return;state.equipped[item.slot]=item;state.activeSlot=null;render();}
function restart(){state={round:0,day:1,loc:generateLocation(0),visited:[],equipped:{head:null,face:null,top:null,bottom:null,bag:null,shoes:null},hand:dealHand(),prevEquipped:{head:null,face:null,top:null,bottom:null,bag:null,shoes:null},itemAge:{},suspicion:20,activeSlot:null,stealCount:0,message:"",gameOver:false,won:false,crime:CRIMES[Math.floor(Math.random()*CRIMES.length)]};render();}

function render(){
  const root=document.getElementById("game-root");
  if(state.gameOver){
    const loc=state.loc;const dateStr=`令和7年 ${Math.floor(Math.random()*12)+1}月${Math.floor(Math.random()*28)+1}日`;const desc=CRIME_DESCS[state.crime]||"各地を逃げ回った末、ついに観念した。";
    if(state.won){root.innerHTML=`<div class="card" style="text-align:center;padding:2rem;"><div style="font-size:52px;margin-bottom:8px;">🎉</div><h2 style="margin-bottom:8px;">100日逃げ切った！</h2><p style="margin-bottom:4px;color:#666;">${state.crime}容疑者、ついに時効・潜伏成功</p><p style="margin-bottom:16px;color:#666;">${TOTAL_DAYS}日間、日本全国を逃げ続けた伝説の逃亡者です。<br>最後にいたのは ${state.loc.flag}${state.loc.name}</p><div class="btn-row" style="justify-content:center;"><button class="btn btn-primary" onclick="restart()">もう一度遊ぶ</button></div></div>`;return;}
    const recentVisited=state.visited.slice(-4).map(l=>l.shortName);const routeText=recentVisited.length>0?recentVisited.join(" → ")+" → "+loc.shortName:loc.shortName;root.innerHTML=`<div class="card"><div class="newspaper"><div class="news-masthead">🗞 号外　逃亡犯逮捕　${dateStr}</div><div class="news-title">${state.crime}犯！${loc.city}で逮捕！</div><div class="news-subtitle">逃亡${state.day}日目／逃亡ルート（直近）：${routeText}</div><hr class="news-rule"><div class="news-body">${loc.pref}${loc.city}の警察は、${loc.town}付近で指名手配中の${state.crime}犯の身柄を確保した。${desc}${state.day}日間に及ぶ逃亡の末、ついに${loc.city}で幕を閉じた。容疑者は「もう一歩だったのに」と悔しそうだったと目撃者は語った。</div></div><div class="btn-row" style="margin-top:12px;"><button class="btn btn-primary" onclick="restart()">もう一度遊ぶ</button></div></div>`;return;
  }
  const loc=state.loc;const disguise=calcDisguise();const risk=getRisk();const stealRisk=getStealRisk();const ri=getRiskInfo(risk);const sri=getRiskInfo(stealRisk);const dIdx=getDisguiseLabelIdx(disguise);const flavor=getFlavorComment();const equippedCount=SLOT_KEYS.filter(s=>state.equipped[s]).length;const{comboName}=getComboBonus();const barColor=disguise<30?"#C0392B":disguise<55?"#E67E22":disguise<75?"#2B8A3E":"#185FA5";
  const locHTML=`<span class="loc-badge current">${state.loc.flag} ${state.loc.pref}${state.loc.city}${state.loc.town}</span><span class="loc-badge" style="margin-left:4px;">逃亡${state.day}日目 / ${TOTAL_DAYS}日逃げ切ろう！</span>`;
  function slotHTML(slot,extraStyle=""){const item=state.equipped[slot];const isActive=state.activeSlot===slot;return`<div class="slot${isActive?" active":""}${item?" set":""}" style="${extraStyle}position:relative;" onclick="activateSlot('${slot}')"><div class="slot-emoji">${item?item.emoji:SLOT_ICONS[slot]}</div><div class="slot-label">${SLOT_LABELS[slot]}</div>${item?`<div class="slot-item-name">${item.name}</div><button onclick="unequipItem('${slot}',event)" style="position:absolute;top:-6px;right:-6px;width:18px;height:18px;border-radius:50%;background:#A32D2D;color:#fff;border:1.5px solid #fff;font-size:10px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;" title="外す">✕</button>`:""}</div>`;}
  const labelsRev=[...DISGUISE_LABELS].reverse();const labelsHTML=labelsRev.map((lbl,i)=>{const li=DISGUISE_LABELS.length-1-i;return`<div class="disguise-label-row"><div class="disguise-tick${li===dIdx?" active":""}"></div><div class="disguise-label${li===dIdx?" active":""}">${li===dIdx?"▶ ":""}${lbl}</div></div>`;}).join("");
  const handFiltered=state.activeSlot?state.hand.filter(i=>i.slot===state.activeSlot):state.hand;
  root.innerHTML=`
  <div class="card" style="margin-bottom:8px;"><div style="display:flex;gap:5px;flex-wrap:wrap;">${locHTML}</div></div>
  <div style="display:flex;gap:10px;margin-bottom:10px;align-items:flex-start;">
    <div class="card" style="flex:0 0 auto;padding:.75rem;"><div class="section-label">着替えて変装しよう</div><div style="display:flex;gap:6px;align-items:flex-start;"><div style="display:flex;flex-direction:column;gap:5px;align-items:center;">${slotHTML("head")}${slotHTML("face")}${slotHTML("top")}${slotHTML("bottom")}${slotHTML("shoes","width:86px;")}</div><div style="display:flex;flex-direction:column;"><div style="height:${86*3+5*2}px;"></div>${slotHTML("bag")}</div></div></div>
    <div style="flex:1;display:flex;flex-direction:column;gap:10px;min-width:0;">
      <div class="card" style="padding:.75rem;flex:1;"><div class="section-label">変装度${comboName?` ✨ ${comboName}`:""}</div><div style="display:flex;gap:10px;height:200px;"><div style="display:flex;flex-direction:column;align-items:center;"><div class="disguise-bar-outer" style="width:44px;flex:1;"><div class="disguise-bar-inner" style="height:${disguise}%;background:${barColor};"></div></div></div><div style="display:flex;flex-direction:column;justify-content:space-between;flex:1;">${labelsHTML}</div></div></div>
      <div class="risk-display" style="background:${ri.bg};border-color:${ri.border};"><div class="section-label" style="color:${ri.color};margin-bottom:5px;">おい！逃亡犯！見ているぞ！</div><div class="risk-eyes">${eyeRowHTML(ri.eyes,risk)}</div><div class="risk-text-big" style="color:${ri.color};">${ri.text}</div><div style="font-size:12px;color:${ri.color};opacity:.8;margin-bottom:4px;">${ri.sub}</div><div class="risk-bar-wrap"><div class="risk-bar-inner" style="width:${risk}%;background:${ri.bar};"></div></div></div>
    </div>
  </div>
  <div class="comment-box">🪞 ${flavor}</div>
  ${state.message?`<div class="comment-box" style="background:#EAF3DE;border-color:#C0DD97;color:#27500A;margin-top:6px;">✅ ${state.message}</div>`:""}
  <div class="card" style="margin-top:10px;"><div class="section-label">変装アイテム：身に着けて変装しよう${state.activeSlot?` — ${SLOT_LABELS[state.activeSlot]}用を選択`:""}</div><div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px;">${SLOT_KEYS.map(s=>`<button class="btn" style="font-size:11px;padding:4px 8px;${state.activeSlot===s?"border-color:#378ADD;background:#E6F1FB;":""}" onclick="activateSlot('${s}')">${SLOT_ICONS[s]}${SLOT_LABELS[s]}</button>`).join("")}${state.activeSlot?`<button class="btn" style="font-size:11px;padding:4px 8px;" onclick="activateSlot(null)">✕</button>`:""}</div><div class="hand-grid">${handFiltered.map(item=>{const inSlot=state.equipped[item.slot]&&state.equipped[item.slot].id===item.id;return`<div class="hand-item${inSlot?" equipped-badge":""}" onclick="equipItem('${item.id}')"><div class="ie">${item.emoji}</div><div class="inm">${item.name}</div><div class="ist">${starsHTML(item.stars)}</div><div class="isl">${SLOT_LABELS[item.slot]}</div></div>`;}).join("")}</div><div style="font-size:11px;color:#aaa;margin-top:6px;">所持アイテム ${state.hand.length}個　装備 ${equippedCount}/6</div></div>
  <div class="card"><div class="btn-row"><button class="btn btn-primary" onclick="proceed()">　${loc.name}を脱出する →</button><button class="btn" onclick="steal()" style="border-color:${sri.border};">🏠 空き巣に入る（リスク：<span style="color:${sri.color};font-weight:600;">${sri.text}</span>）</button></div></div>`;
}
render();
</script>
</body>
</html>
